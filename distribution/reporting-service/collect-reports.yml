name: Collect EEGLAB technical reports
on:
  push:
    branches: [main]
    paths: ['diagnostic-sources.json', '.github/workflows/collect-reports.yml']
  workflow_dispatch:
    inputs:
      self_test:
        description: Run a synthetic live delivery test
        type: boolean
        default: false
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: eeglab-report-delivery
  cancel-in-progress: false
jobs:
  request-live-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      # Keep the service's schedule/workflow_dispatch identity restriction.
      # GitHub explicitly supports workflow_dispatch from GITHUB_TOKEN.
      - run: gh workflow run collect-reports.yml --repo "$GITHUB_REPOSITORY" --ref main -f self_test=true
        env:
          GH_TOKEN: ${{ github.token }}
  collect:
    if: github.event_name != 'push' && (vars.REPORTING_READY == 'true' || inputs.self_test == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node collect-reports.mjs
        if: inputs.self_test != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORTING_ENDPOINT: https://xuhumtlubgkqfcfrrwiv.supabase.co/functions/v1/eeglab-reports
      - run: node live-test.mjs
        if: inputs.self_test == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORTING_ENDPOINT: https://xuhumtlubgkqfcfrrwiv.supabase.co/functions/v1/eeglab-reports
